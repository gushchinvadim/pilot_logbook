{% extends 'admin/base_site.html' %}
{% load static %}

{% block title %}Календарь сессий{% endblock %}

{% block content %}
<h1>Запланированные сессии</h1>

<div id="calendar"></div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: '{% url "admin:calendar_events" %}',
        eventColor: '#3780cc',
        eventTextColor: 'white',

        // Формат времени внутри событий
        eventTimeFormat: {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,  // ← важно: отключает AM/PM
            meridiem: false // ← можно оставить, но hour12: false приоритетнее
        },

        // Формат временных меток в timeGrid (слева)
        slotLabelFormat: {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        },

        // Также можно задать формат для заголовков временных слотов (если нужно)
        // slotLabelInterval: '01:00' — по умолчанию и так час
    });
    calendar.render();
});
</script>
{% endblock %}
