server {
    listen 80;
    server_name survey-ebt.ru www.survey-ebt.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://type-rating.survey-ebt.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name survey-ebt.ru www.survey-ebt.ru;
    ssl_certificate /etc/letsencrypt/live/survey-ebt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/survey-ebt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { return 301 https://type-rating.survey-ebt.ru$request_uri; }
}
