# Complete site configuration after a certificate for survey-ebt.ru is available.
# All paths assume /srv/sim-training/current is the application release/checkout.
upstream sim_training_api {
    server 127.0.0.1:8010;
}
server {
    listen 80;
    server_name survey-ebt.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://survey-ebt.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name survey-ebt.ru;
    ssl_certificate /etc/letsencrypt/live/survey-ebt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/survey-ebt.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    root /srv/sim-training/current/frontend/dist;
    index index.html;
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /static/ {
        alias /srv/sim-training/shared/staticfiles/;
        autoindex off;
    }
    # Preserve Django/admin/print routes instead of letting React swallow them.
    # Media is served through authenticated Django views, never a public directory alias.
    location ~ ^/(api|admin|media|pilot-partial|pilot-search|print-rating-token|print-rating-unsafe)(/|$) {
        proxy_pass http://sim_training_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
}
