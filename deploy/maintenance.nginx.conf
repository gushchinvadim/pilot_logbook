# SIM_TRAINING_MAINTENANCE — installed only by site_control.py; original config is saved separately.
server {
    listen 80;
    server_name type-rating.survey-ebt.ru;
    error_page 503 /__sim_training_maintenance.html;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location = /__sim_training_maintenance.html {
        internal;
        alias /srv/sim-training/maintenance/index.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "300" always;
        add_header X-SIM-Maintenance "on" always;
    }
    location / { return 503; }
}
server {
    listen 443 ssl;
    server_name type-rating.survey-ebt.ru;
    ssl_certificate /etc/letsencrypt/live/type-rating.survey-ebt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/type-rating.survey-ebt.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 503 /__sim_training_maintenance.html;
    location = /__sim_training_maintenance.html {
        internal;
        alias /srv/sim-training/maintenance/index.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "300" always;
        add_header X-SIM-Maintenance "on" always;
    }
    location / { return 503; }
}
